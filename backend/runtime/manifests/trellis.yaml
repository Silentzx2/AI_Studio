name: trellis
label: TRELLIS
source:
  repo: https://github.com/microsoft/TRELLIS.git
  ref: main
  submodules: true
  local_dir: TRELLIS
environment:
  python: '3.10'
  torch: 2.5.1
  # CUDA version is dynamically detected at install time
  python_pin_rewrites:
  # flash-attn / bpy publish no cp312 wheels (CUDA-build / Blender-bound);
  # not installable on a CPU Py3.12 box — drop rather than fail the venv.
  - pattern: "^flash[-_]attn($|==|>=|<=|!=|~=).*$"
    replacement: null
  - pattern: "^bpy==.*$"
    replacement: null
  # torch-cluster and diso are CUDA-only native extensions with no cp312 wheels.
  # Drop both on Py3.12+ to avoid heavy native builds (15-60 min) on Colab.
  - pattern: "^torch[-_]cluster($|==|>=|<=|!=|~=).*$"
    replacement: null
  - pattern: "^diso($|==|>=|<=|!=|~=).*$"
    replacement: null
dependencies:
  python:
  - pillow
  - imageio
  - imageio-ffmpeg
  - tqdm
  - easydict
  - opencv-python-headless
  - scipy
  - ninja
  - rembg
  - onnxruntime
  - trimesh
  - open3d
  - xatlas
  - pyvista
  - pymeshfix
  - igraph
  - transformers
  - git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8
  imports:
  - torch
  - transformers
  - trimesh
  native:
  - flash-attn==2.8.3
  - xformers
  - git+https://github.com/JeffreyXiang/diffoctreerast.git
  - vox2seq
  - git+https://github.com/autonomousvision/mip-splatting.git#subdirectory=submodules/diff-gaussian-rasterization
  - spconv-cu120
  - kaolin==0.18.0
  - git+https://github.com/NVlabs/nvdiffrast.git
  # CUDA-only packages: dropped on CPU-only hosts (no CUDA toolkit)
  cuda_native_packages:
   - flash-attn
   - xformers
  # Packages whose build step imports torch (need --no-build-isolation-package)
  torch_build_packages:
  - flash-attn
  - torch-cluster
  - torch-scatter
  - torch-sparse
  - torchmcubes
  - torch-geometric
  - diso
  # Pre-install these when rembg is detected (py3.12 compat for pymatting chain)
  rembg_preinstall:
  - pymatting>=1.1.15
  - numba>=0.60
  - llvmlite>=0.43
  attention_backend:
    one_of:
    - xformers
    - flash-attn
  extra:
  - accelerate>=0.34.0
  wheels:
    flash-attn:
      available: true
      direct_url_template: https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.0.0/flash_attn-{version}+cu{cuda}torch{torch}-cp{python}-cp{python}-linux_x86_64.whl
    xformers:
      available: true
      mode: pypi
    spconv-cu120:
      available: true
      mode: pypi
    kaolin:
      available: true
      index: https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-{torch_ver}_cu{cuda_ver}.html
    diffoctreerast:
      available: false
      reason: No verified wheel target for this source in current manifest; source
        build fallback is allowed.
    vox2seq:
      available: false
      reason: Local extension; no standalone prebuilt wheel is declared.
    diff-gaussian-rasterization:
      available: false
      reason: VCS subdirectory dependency; no verified prebuilt wheel target is declared.
    mip-splatting:
      available: false
      reason: VCS parent repository used only as source for diff-gaussian-rasterization.
  fallbacks:
    diffoctreerast: []
    nvdiffrast: []
    kaolin:
    - https://nvidia-kaolin.s3.us-east-2.amazonaws.com/
    - https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.5.1_cu124.html
  optional:
  - flash-attn
  - xformers
  representation_required:
  - nvdiffrast
  - diffoctreerast
  - vox2seq
  - diff-gaussian-rasterization
  - kaolin
  local_extensions:
    vox2seq:
      path: extensions/vox2seq
      hf_dataset: argojuni0506/TRELLIS-3D
      hf_allow_pattern: "extensions/vox2seq/**"
  build_flags:
    diff-gaussian-rasterization:
      shallow_clone: true
  build_deps:
    flash-attn: ["ninja"]
    diffoctreerast: ["ninja"]
    nvdiffrast: ["ninja"]
    diff-gaussian-rasterization: ["ninja"]
  cuda_native:
  - flash-attn
  - xformers
  - diffoctreerast
  - vox2seq
  - diff-gaussian-rasterization
  - spconv-cu120
  - kaolin
  - nvdiffrast
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
weights:
  primary:
    repo: microsoft/TRELLIS-image-large
  auxiliary: []
  size_estimate_gb: 3.5
hardware:
  minimum_vram_mb: 8000
  recommended_vram_mb: 16000
capabilities:
  shape:
    enabled: true
    native_build_required: true
    native_steps:
    - git submodule update --init --recursive
    - pip install ./trellis/representations/mesh/flexicubes
    vram_required_mb: 8000
  texture:
    enabled: true
    native_build_required: false
    vram_required_mb: 16000
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - transformers
  - trimesh
  check_weights: true
  check_cuda: true
  check_native_extensions:
  - FlexiCubes
  load_weights: true
  smoke_inference: true
