name: trellis
label: "TRELLIS"
source:
  repo: "https://github.com/microsoft/TRELLIS.git"
  ref: "main"
  submodules: true
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.1"
dependencies:
  python:
    # Core runtime deps from upstream setup.sh --basic
    - "pillow"
    - "imageio"
    - "imageio-ffmpeg"
    - "tqdm"
    - "easydict"
    - "opencv-python-headless"
    - "scipy"
    - "ninja"
    - "rembg"
    - "onnxruntime"
    - "trimesh"
    - "open3d"
    - "xatlas"
    - "pyvista"
    - "pymeshfix"
    - "igraph"
    - "transformers"
    - "git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8"
  imports:
    - "torch"
    - "transformers"
    - "trimesh"
  native:
    # Optional CUDA extensions — handled by native resolver (wheel-first)
    - "flash_attn"
    - "xformers"
    - "git+https://github.com/JeffreyXiang/diffoctreerast.git"
    - "vox2seq"
    - "git+https://github.com/autonomousvision/mip-splatting.git#subdirectory=submodules/diff-gaussian-rasterization"
    - "spconv"
    - "kaolin==0.18.0"
    - "git+https://github.com/NVlabs/nvdiffrast.git"
  attention_backend:
    one_of:
      - "flash-attn"
      - "xformers"
weights:
  primary:
    repo: "microsoft/TRELLIS-image-large"
  auxiliary: []
hardware:
  minimum_vram_mb: 8000
  # Studio recommended target for generation, not upstream hard minimum.
  recommended_vram_mb: 24000
capabilities:
  shape:
    enabled: true
    native_build_required: true
    # Build the modified FlexiCubes CUDA extension from its git submodule.
    native_steps:
      - "git submodule update --init --recursive"
      - "pip install ./trellis/representations/mesh/flexicubes"
    vram_required_mb: 8000
  texture:
    enabled: true
    native_build_required: false
    vram_required_mb: 16000
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "transformers"
    - "trimesh"
  check_weights: true
  check_cuda: true
  check_native_extensions:
    - "FlexiCubes"
  load_weights: true
  smoke_inference: true
