name: triposr
label: TripoSR
source:
  repo: https://github.com/VAST-AI-Research/TripoSR.git
  ref: 107cefdc244c39106fa830359024f6a2f1c78871
  submodules: false
  local_dir: TripoSR
environment:
  python: '3.10'
  torch: 2.5.1
  python_pin_rewrites:
  - pattern: "^numpy==1\\.22\\..*$"
    replacement: "numpy>=1.24.4,<2.0"
  - pattern: "^torchmcubes($|==|>=|<=|!=|~=).*$"
    replacement: "git+https://github.com/tatsy/torchmcubes.git"
dependencies:
  python:
  - omegaconf>=2.3.0
  - Pillow>=10.1.0
  - einops>=0.7.0
  - transformers>=4.35.0
  - trimesh>=4.0.5
  - rembg
  - huggingface-hub
  - imageio[ffmpeg]
  - gradio
  - xatlas
  - moderngl
  - numpy>=1.24.4,<2.0
  imports:
  - torch
  - tsr
  - rembg
  - trimesh
  - xatlas
  - einops
  - transformers
  native:
  - git+https://github.com/tatsy/torchmcubes.git
  cuda_native_packages:
  - torchmcubes
  torch_build_packages:
  - torchmcubes
  extra:
  - huggingface_hub>=0.28.0
  wheels:
    torchmcubes:
      available: false
      reason: Upstream Git VCS dependency requires source build with CUDA toolkit.
  fallbacks: {}
  optional: []
  build_deps:
    torchmcubes: ["ninja", "setuptools<70", "scikit-build-core>=1.0", "pybind11>=2.10"]
  cuda_native:
  - torchmcubes
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
weights:
  primary:
    repo: stabilityai/TripoSR
  size_estimate_gb: 2
hardware:
  category: 3d_generation
  minimum_vram_mb: 6144
  recommended_vram_mb: 8192
  low_vram_supported: true
  low_vram_required_mb: 4096
  low_vram_strategy:
  - chunk_size_2048
  - mc_resolution_128
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 6144
    supports_image_to_3d: true
    supports_text_to_3d: false
  texture_pbr:
    enabled: true
    native_build_required: false
    vram_required_mb: 2048
    supports_texture_generation: true
runtime:
  workspace_compatibility:
  - mesh-generation
  - texture-generation
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - tsr
  - trimesh
  - rembg
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
