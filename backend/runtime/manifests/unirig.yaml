name: unirig
label: "UniRig"
source:
  repo: "https://github.com/VAST-AI-Research/UniRig.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    # From upstream requirements.txt
    - "transformers==4.51.3"
    - "python-box"
    - "einops"
    - "omegaconf"
    - "pytorch_lightning"
    - "lightning"
    - "addict"
    - "timm"
    - "fast-simplification"
    - "trimesh"
    - "open3d"
    - "pyrender"
    - "huggingface_hub"
    - "accelerate>=0.34.0"
    - "scipy"
    - "pillow"
    - "numpy"
    - "tqdm"
    - "pyyaml"
    # Native CUDA extensions (also in native section for wheel-first)
    - "torch_scatter"
    - "torch_cluster"
    - "spconv"
  imports:
    - "torch"
    - "transformers"
  native:
    # CUDA extensions — handled by native resolver (wheel-first)
    - "flash_attn"
    - "bpy"
    - "spconv"
    - "torch_scatter"
    - "torch_cluster"
    - "pytorch3d"
weights:
  primary:
    repo: "VAST-AI/UniRig"
  auxiliary: []
hardware:
  minimum_vram_mb: 8000
  recommended_vram_mb: 8000
capabilities:
  shape:
    enabled: true
    native_build_required: true
    # Build the geometric CUDA extensions required for rigging inference.
    native_steps:
      - "pip install spconv torch_scatter torch_cluster pytorch3d"
    vram_required_mb: 8000
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  rigging:
    enabled: true
    native_build_required: true
    native_steps:
      - "pip install spconv torch_scatter torch_cluster pytorch3d"
    vram_required_mb: 8000
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "transformers"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
