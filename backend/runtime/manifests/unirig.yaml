name: unirig
label: UniRig
source:
  repo: https://github.com/VAST-AI-Research/UniRig.git
  ref: main
  submodules: false
  local_dir: UniRig
environment:
  python: '3.10'
  torch: 2.5.1
  cuda: '12.4'
dependencies:
  python:
  - transformers==4.51.3
  - python-box
  - einops
  - omegaconf
  - pytorch_lightning
  - lightning
  - addict
  - timm
  - fast-simplification
  - trimesh
  - open3d
  - pyrender
  - huggingface_hub
  - wandb
  - numpy==1.26.4
  imports:
  - torch
  - transformers
  native:
  - spconv
  - torch_scatter
  - torch_cluster
  - pytorch3d
  extra: []
  wheels:
    spconv:
      available: true
      mode: pypi
    torch_scatter:
      available: true
      index: https://data.pyg.org/whl/torch-{torch_ver}+cu{cuda_ver}.html
    torch_cluster:
      available: true
      index: https://data.pyg.org/whl/torch-{torch_ver}+cu{cuda_ver}.html
    pytorch3d:
      available: true
      mode: extra_index
      index: https://miropsota.github.io/torch_packages_builder
      version: "0.7.9+d9839a9"
    bpy:
      available: false
      reason: "bpy is Blender's Python API — it ships with Blender, not PyPI. Install Blender separately to enable headless rigging."
  fallbacks:
    pytorch3d:
    - https://miropsota.github.io/torch_packages_builder
    nvdiffrast: []
  # bpy is only used by the headless Blender subprocess script (blender/scripts/process_mesh.py).
  # It is NOT imported by any in-process provider code. The pipeline degrades gracefully
  # when Blender is absent (pipeline.py checks blender_enabled + shutil.which).
  optional:
  - bpy
  - flash-attn
  representation_required:
  - pytorch3d
  local_extensions: {}
weights:
  primary:
    repo: VAST-AI/UniRig
  auxiliary: []
  size_estimate_gb: 2
hardware:
  minimum_vram_mb: 8000
  recommended_vram_mb: 8000
capabilities:
  shape:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install spconv torch_scatter torch_cluster pytorch3d
    vram_required_mb: 8000
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  rigging:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install spconv torch_scatter torch_cluster pytorch3d
    vram_required_mb: 8000
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
