name: unirig
label: UniRig
source:
  repo: https://github.com/VAST-AI-Research/UniRig.git
  ref: main
  submodules: false
  local_dir: UniRig
environment:
  python: '3.11'
  torch: '>=2.3.1'
  cuda: '12.4'
dependencies:
  python:
  - transformers==4.51.3
  - python-box
  - einops
  - omegaconf
  - pytorch_lightning
  - lightning
  - addict
  - timm
  - fast-simplification
  - trimesh
  - open3d
  - pyrender
  - huggingface_hub
  - wandb
  - scipy
  - Pillow
  - tqdm
  - pyyaml
  - numpy==1.26.4
  imports:
  - torch
  - transformers
  native:
  - spconv
  - torch_scatter
  - torch_cluster
  # CUDA-only packages: dropped on CPU-only hosts (no CUDA toolkit)
  cuda_native_packages:
  - torch_scatter
  - torch_cluster
  # Packages whose build step imports torch (need --no-build-isolation-package)
  torch_build_packages:
  - torch_scatter
  - torch_cluster
  - spconv
  extra: []
  wheels:
    spconv:
      available: true
      mode: pypi
    torch_scatter:
      available: true
      index: https://data.pyg.org/whl/torch-{torch_ver}+cu{cuda_ver}.html
    torch_cluster:
      available: true
      index: https://data.pyg.org/whl/torch-{torch_ver}+cu{cuda_ver}.html
    bpy:
      available: false
      reason: "bpy is Blender's Python API — it ships with Blender, not PyPI. Install Blender separately to enable headless rigging."
  fallbacks: {}
  # bpy is only used by the headless Blender subprocess script (blender/scripts/process_mesh.py).
  # It is NOT imported by any in-process provider code. The pipeline degrades gracefully
  # when Blender is absent (pipeline.py checks blender_enabled + shutil.which).
  optional:
  - bpy
  - flash-attn
  representation_required: []
  local_extensions: {}
  build_deps:
    torch_scatter: ["ninja", "pkg-config"]
    torch_cluster: ["ninja", "pkg-config", "setuptools<70"]
  cuda_native:
  - spconv
  - torch_scatter
  - torch_cluster
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
    CUDA_HOME: "/usr/local/cuda"
weights:
  primary:
    repo: VAST-AI/UniRig
  auxiliary: []
  size_estimate_gb: 2
hardware:
  minimum_vram_mb: 8000
  recommended_vram_mb: 8000
capabilities:
  shape:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install spconv torch_scatter torch_cluster
    vram_required_mb: 8000
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  rigging:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install spconv torch_scatter torch_cluster
    vram_required_mb: 8000
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
