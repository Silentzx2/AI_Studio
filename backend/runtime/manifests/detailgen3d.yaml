name: detailgen3d
label: DetailGen3D
source:
  repo: https://github.com/VAST-AI-Research/DetailGen3D.git
  ref: main
  submodules: false
  local_dir: DetailGen3D
environment:
  python: '3.10'
  torch: 2.5.1
  cuda: '12.4'
dependencies:
  python:
  - diffusers
  - transformers==4.49.0
  - einops
  - huggingface_hub
  - opencv-python
  - trimesh==4.5.3
  - omegaconf
  - scikit-image
  - numpy==1.22.3
  - scipy==1.11.4
  - jaxtyping
  - typeguard
  - peft==0.17.1
  - pymeshlab==2022.2.post4
  imports:
  - torch
  - transformers
  native:
  - diso
  - torch-cluster
  extra: []
  wheels:
    diso:
      available: false
      reason: No compatible prebuilt wheel on PyPI (source-only). Source build requires ninja.
    torch-cluster:
      available: true
      index: https://data.pyg.org/whl/torch-{torch_ver}+cu{cuda_ver}.html
  fallbacks: {}
  optional: []
  representation_required:
  - diso
  local_extensions: {}
weights:
  primary:
    repo: VAST-AI/DetailGen3D
  auxiliary: []
  size_estimate_gb: 2
hardware:
  minimum_vram_mb: 4000
  recommended_vram_mb: 4000
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 4000
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  detail_enhancement:
    enabled: true
    native_build_required: false
    vram_required_mb: 4000
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
