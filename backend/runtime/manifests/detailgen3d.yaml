name: detailgen3d
label: DetailGen3D
source:
  repo: https://github.com/VAST-AI-Research/DetailGen3D.git
  ref: main
  submodules: false
  local_dir: DetailGen3D
environment:
  python: '3.10'
  torch: 2.5.1
  # CUDA version is dynamically detected at install time
  python_pin_rewrites:
  # numpy 1.22.x builds via distutils (gone in 3.12); rewrite to a cp312
  # compatible pin that stays <2.0 to match the backend venv's numpy<2.0.
  - pattern: "^numpy==1\\.22\\..*$"
    replacement: "numpy>=1.26.4,<2.0"
  # flash-attn publishes no cp312 wheels — drop on Py3.12
  - pattern: "^flash[-_]attn($|==|>=|<=|!=|~=).*$"
    replacement: null
dependencies:
  python:
   - Pillow>=10.0
   - imageio
   - imageio-ffmpeg
   - diffusers
   - transformers==4.49.0
   - einops
   - huggingface_hub
   - opencv-python
   - trimesh==4.5.3
   - omegaconf
   - scikit-image
   - numpy==1.22.3
   - scipy==1.11.4
   - jaxtyping
   - typeguard
   - peft==0.17.1
   - pymeshlab==2022.2.post4
   - tqdm
   - rembg
  imports:
   - torch
   - transformers
  native:
   - diso
   - torch-cluster
  # CUDA-only packages: dropped on CPU-only hosts (no CUDA toolkit)
  cuda_native_packages:
   - diso
   - torch-cluster
  # Packages whose build step imports torch (need --no-build-isolation-package)
  torch_build_packages:
   - diso
   - torch-cluster
  extra: []
  wheels:
    diso:
      available: false
      reason: PyPI wheel requires compilation; source build with CUDA toolkit needed.
    torch-cluster:
      available: true
      index: https://data.pyg.org/whl/torch-{torch_ver}+cu{cuda_ver}.html
  fallbacks: {}
  optional: []
  representation_required:
   - diso
  local_extensions: {}
  build_deps:
    diso: ["ninja", "setuptools<70"]
    torch-cluster: ["ninja", "pkg-config", "setuptools<70"]
  cuda_native:
   - diso
   - torch-cluster
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
weights:
  primary:
    repo: VAST-AI/DetailGen3D
  auxiliary: []
  size_estimate_gb: 4
hardware:
  minimum_vram_mb: 4000
  recommended_vram_mb: 4000
capabilities:
  # DetailGen3D is refinement-only; it must never advertise standalone shape generation.
  shape:
    enabled: false
    native_build_required: false
    vram_required_mb: 4000
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  detail_enhancement:
    enabled: true
    native_build_required: false
    vram_required_mb: 4000
preflight:
  check_model_venv: true
  import_packages:
   - torch
   - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
