name: detailgen3d
label: "DetailGen3D"
source:
  repo: "https://github.com/VAST-AI-Research/DetailGen3D.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    # From upstream requirements.txt
    - "diffusers"
    - "transformers"
    - "einops"
    - "huggingface_hub"
    - "opencv-python"
    - "trimesh"
    - "omegaconf"
    - "scikit-image"
    - "numpy==1.22.3"
    - "jaxtyping"
    - "typeguard"
    # Native CUDA extensions (also listed in native section for wheel-first)
    - "diso"
    - "torch-cluster"
  imports:
    - "torch"
    - "transformers"
  native:
    # CUDA extensions — handled by native resolver (wheel-first)
    - "diso"
    - "torch-cluster"
weights:
  primary:
    repo: "VAST-AI/DetailGen3D"
  auxiliary: []
hardware:
  minimum_vram_mb: 4000
  recommended_vram_mb: 4000
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 4000
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  detail_enhancement:
    enabled: true
    native_build_required: false
    vram_required_mb: 4000
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "transformers"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
