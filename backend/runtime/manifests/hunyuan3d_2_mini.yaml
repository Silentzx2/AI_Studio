name: hunyuan3d-2-mini
label: "Hunyuan3D 2 Mini"
source:
  repo: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    # Same repo as hunyuan3d-2 — same dependencies
    - "ninja"
    - "pybind11"
    - "diffusers"
    - "einops"
    - "opencv-python"
    - "numpy"
    - "transformers"
    - "tqdm"
    - "trimesh"
    - "pymeshlab"
    - "pygltflib"
    - "xatlas"
    - "accelerate"
    - "rembg"
    - "onnxruntime"
    - "omegaconf"
    # Inference library (not in upstream requirements.txt)
    - "hy3dgen"
  imports:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  native: []
weights:
  primary:
    repo: "tencent/Hunyuan3D-2mini"
  auxiliary: []
hardware:
  minimum_vram_mb: 4096
  recommended_vram_mb: 6144
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 4096
  texture_pbr:
    enabled: true
    native_build_required: false
    vram_required_mb: 6144
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
