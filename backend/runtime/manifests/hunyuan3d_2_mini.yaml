name: hunyuan3d-2-mini
label: Hunyuan3D 2 Mini
source:
  repo: https://github.com/Tencent-Hunyuan/Hunyuan3D-2.git
  ref: main
  submodules: false
  local_dir: Hunyuan3D-2mini
environment:
  python: '3.10'
  torch: 2.5.1
  cuda: '12.4'
dependencies:
  python:
    - ninja
    - pybind11
    - diffusers
    - einops
    - opencv-python
    - numpy
    - transformers>=4.48.0
    - tqdm
    - trimesh
    - pymeshlab
    - pygltflib
    - xatlas
    - accelerate
    - rembg
    - onnxruntime
    - Pillow>=10.0
    - omegaconf
  imports:
  - torch
  - diffusers
  - transformers
  - accelerate
  native: []
  # Pre-install these when rembg is detected (py3.12 compat for pymatting chain)
  rembg_preinstall:
  - pymatting>=1.1.15
  - numba>=0.60
  - llvmlite>=0.43
  extra:
  - hy3dgen==2.0.2
  - huggingface_hub>=0.28.0
  wheels: {}
  fallbacks: {}
  optional: []
  representation_required: []
  local_extensions: {}
  build_deps: {}
  cuda_native: []
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
    CUDA_HOME: "/usr/local/cuda"
weights:
  primary:
    repo: tencent/Hunyuan3D-2mini
  auxiliary: []
  size_estimate_gb: 4
  allow_patterns:
  - hunyuan3d-dit-v2-mini/*
  ignore_patterns:
  - '*.ckpt'
hardware:
  minimum_vram_mb: 4096
  recommended_vram_mb: 6144
  low_vram_supported: true
  low_vram_required_mb: 4096
  low_vram_strategy:
    - fp16
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 4096
  texture_pbr:
    enabled: true
    native_build_required: false
    vram_required_mb: 6144
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - diffusers
  - transformers
  - accelerate
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
