name: hunyuan3d-2
label: "Hunyuan3D 2"
source:
  repo: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    - "hy3dgen"
    - "accelerate>=0.34.0"
    - "huggingface_hub==0.27.1"
  imports:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  native: []
weights:
  primary:
    repo: "tencent/Hunyuan3D-2"
  auxiliary: []
hardware:
  minimum_vram_mb: 16384
  recommended_vram_mb: 24500
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 16384
  texture_pbr:
    enabled: true
    native_build_required: false
    vram_required_mb: 24500
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
