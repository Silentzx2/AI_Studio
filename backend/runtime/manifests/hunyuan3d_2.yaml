name: hunyuan3d-2
label: Hunyuan3D 2
source:
  repo: https://github.com/Tencent-Hunyuan/Hunyuan3D-2.git
  ref: main
  submodules: false
  local_dir: Hunyuan3D-2
environment:
  python: '3.10'
  torch: 2.5.1
  cuda: '12.4'
dependencies:
  python:
  - ninja
  - pybind11
  - diffusers
  - einops
  - opencv-python
  - numpy
  - transformers>=4.48.0
  - tqdm
  - trimesh
  - pymeshlab
  - pygltflib
  - xatlas
  - accelerate
  - rembg
  - onnxruntime
  - omegaconf
  - hy3dgen
  imports:
  - torch
  - diffusers
  - transformers
  - accelerate
  native: []
  extra:
  - hy3dgen
  - accelerate>=0.34.0
  - huggingface_hub>=0.28.0
  wheels: {}
  fallbacks: {}
  optional: []
  representation_required: []
  local_extensions: {}
weights:
  primary:
    repo: tencent/Hunyuan3D-2
  auxiliary: []
  size_estimate_gb: 24
hardware:
  minimum_vram_mb: 16384
  recommended_vram_mb: 24500
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 16384
  texture_pbr:
    enabled: true
    native_build_required: false
    vram_required_mb: 24500
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - diffusers
  - transformers
  - accelerate
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
