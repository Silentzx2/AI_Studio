name: hunyuan3d-2.1
label: "Hunyuan3D 2.1"
source:
  repo: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    # From upstream requirements.txt
    - "ninja==1.11.1.1"
    - "pybind11==2.13.4"
    - "transformers==4.46.0"
    - "diffusers==0.30.0"
    - "accelerate==1.1.1"
    - "pytorch-lightning==1.9.5"
    - "huggingface-hub==0.30.2"
    - "safetensors==0.4.4"
    - "numpy==1.24.4"
    - "scipy==1.14.1"
    - "einops==0.8.0"
    - "pandas==2.2.2"
    - "opencv-python==4.10.0.84"
    - "imageio==2.36.0"
    - "scikit-image==0.24.0"
    - "rembg==2.0.65"
    - "realesrgan==0.3.0"
    - "trimesh==4.4.7"
    - "pymeshlab==2022.2.post3"
    - "pygltflib==1.16.3"
    - "xatlas==0.0.9"
    - "open3d==0.18.0"
    - "omegaconf==2.3.0"
    - "pyyaml==6.0.2"
    - "tqdm==4.66.5"
    - "psutil==6.0.0"
    - "onnxruntime==1.16.3"
    - "torchmetrics==1.6.0"
    - "pydantic==2.10.6"
    - "timm"
    - "torchdiffeq"
    - "pillow"
    - "basicsr==1.4.2"
    - "configargparse==1.7"
    # Inference library (not in upstream requirements.txt)
    - "hy3dgen"
  imports:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  native:
    # CUDA-specific, no cp312 wheel — handled by native resolver
    - "cupy-cuda12x"
weights:
  primary:
    repo: "tencent/Hunyuan3D-2.1"
  auxiliary: []
hardware:
  minimum_vram_mb: 10240
  recommended_vram_mb: 29000
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 10240
  texture_pbr:
    enabled: true
    native_build_required: true
    # Build the custom differentiable rasterizer shipped in the repo.
    native_steps:
      - "pip install -e ./hy3dpaint/custom_rasterizer"
    vram_required_mb: 29000
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "diffusers"
    - "transformers"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
