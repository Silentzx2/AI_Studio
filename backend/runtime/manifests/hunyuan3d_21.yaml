name: hunyuan3d-2.1
label: Hunyuan3D 2.1
source:
  repo: https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1.git
  ref: main
  submodules: false
  local_dir: Hunyuan3D-2.1
environment:
  python: '3.10'
  torch: 2.5.1
  # CUDA version is dynamically detected at install time
  python_pin_rewrites:
  # numpy 1.22.x builds via distutils (gone in 3.12); rewrite to a cp312
  # compatible pin that stays <2.0 to match the backend venv's numpy<2.0.
  - pattern: "^numpy==1\\.22\\..*$"
    replacement: "numpy>=1.26.4,<2.0"
  # open3d 0.18.0 has no cp312 wheel; 0.19.0 is the first with one.
  - pattern: "^open3d==0\\.18\\.0$"
    replacement: "open3d==0.19.0"
  # flash-attn / bpy publish no cp312 wheels — drop on Py3.12
  - pattern: "^flash[-_]attn($|==|>=|<=|!=|~=).*$"
    replacement: null
  - pattern: "^bpy==.*$"
    replacement: null
dependencies:
  python:
   - Pillow>=10.0
   - ninja==1.11.1.1
   - pybind11==2.13.4
   - transformers==4.46.0
   - diffusers==0.30.0
   - accelerate==1.1.1
   - pytorch-lightning==1.9.5
   - huggingface-hub==0.30.2
   - safetensors==0.4.4
   - numpy==1.24.4
   - scipy==1.14.1
   - einops==0.8.0
   - pandas==2.2.2
   - opencv-python==4.10.0.84
   - imageio==2.36.0
   - scikit-image==0.24.0
   - rembg==2.0.65
   - realesrgan==0.3.0
   - tb_nightly==2.18.0a20240726
   - basicsr==1.4.2
   - trimesh==4.4.7
   - pymeshlab==2022.2.post3
   - pygltflib==1.16.3
   - xatlas==0.0.9
   - open3d==0.18.0
   - omegaconf==2.3.0
   - pyyaml==6.0.2
   - tqdm==4.66.5
   - psutil==6.0.0
   - onnxruntime==1.16.3
   - torchmetrics==1.6.0
   - pydantic==2.10.6
   - timm
   - torchdiffeq
   - pythreejs
   - configargparse==1.7
   # deepspeed: training-only, not required for inference
  imports:
   - torch
   - diffusers
   - transformers
   - accelerate
  native:
   - cupy-cuda12x==13.4.1
  # CUDA-only packages: dropped on CPU-only hosts (no CUDA toolkit)
  cuda_native_packages:
   - cupy-cuda12x
  # Pre-install these when rembg is detected (py3.12 compat for pymatting chain)
  rembg_preinstall:
   - pymatting>=1.1.15
   - numba>=0.60
   - llvmlite>=0.43
  extra:
   - accelerate>=0.34.0
   - huggingface_hub>=0.28.0
  wheels:
    cupy-cuda12x:
      available: true
      mode: pypi
    bpy:
      available: false
      reason: "bpy is Blender's Python API — it ships with Blender, not PyPI. Install Blender separately to enable headless mesh cleanup/rigging."
  fallbacks: {}
  # bpy is only used by the headless Blender subprocess script (blender/scripts/process_mesh.py).
  # It is NOT imported by any in-process provider code. The pipeline degrades gracefully
  # when Blender is absent (pipeline.py checks blender_enabled + shutil.which).
  optional:
   - bpy
  representation_required: []
  local_extensions: {}
  build_deps: {}
  cuda_native:
   - cupy-cuda12x
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
weights:
  primary:
    repo: tencent/Hunyuan3D-2.1
  auxiliary: []
  size_estimate_gb: 15
hardware:
  minimum_vram_mb: 10240
  recommended_vram_mb: 29000
  low_vram_supported: true
  low_vram_required_mb: 8192
  low_vram_strategy:
    - sequential_cpu_offload
    - fp16
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 10240
  texture_pbr:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install -e ./hy3dpaint/custom_rasterizer
    - cd ./hy3dpaint/DifferentiableRenderer && bash compile_mesh_painter.sh
    vram_required_mb: 29000
preflight:
  check_model_venv: true
  import_packages:
   - torch
   - diffusers
   - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
