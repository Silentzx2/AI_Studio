name: anigen
label: AniGen
source:
  repo: https://github.com/VAST-AI-Research/AniGen.git
  ref: main
  submodules: false
  local_dir: AniGen
environment:
  python: '3.10'
  torch: 2.5.1
  cuda: '12.4'
dependencies:
  python:
  - pillow>=10.0
  - imageio>=2.31
  - imageio-ffmpeg>=0.5
  - tqdm>=4.60
  - easydict>=1.10
  - opencv-python-headless>=4.8
  - scipy>=1.10
  - ninja
  - rembg>=2.0
  - onnxruntime>=1.17
  - trimesh>=4.0
  - xatlas>=0.0.9
  - pyvista>=0.43
  - pymeshfix>=0.17
  - igraph>=0.11
  - pygltflib>=1.16
  - numpy>=1.24,<2
  - psutil>=5.9
  - safetensors>=0.4
  - scikit-learn>=1.3
  - geffnet>=1.0
  - transformers>=4.40
  - utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8
  imports:
  - torch
  - transformers
  native:
  - spconv
  - pytorch3d
  - git+https://github.com/NVlabs/nvdiffrast.git
  extra: []
  wheels:
    spconv:
      available: true
      mode: pypi
    pytorch3d:
      available: true
      index: https://miropsota.github.io/torch_packages_builder
    nvdiffrast:
      available: false
      reason: No verified wheel target for this source in current manifest; source
        build fallback is allowed.
  fallbacks:
    pytorch3d:
    - https://miropsota.github.io/torch_packages_builder
    - pypi
    nvdiffrast: []
  optional: []
  representation_required: []
  local_extensions: {}
weights:
  primary:
    repo: VAST-AI/AniGen_Weights
  auxiliary: []
  size_estimate_gb: 23
hardware:
  minimum_vram_mb: 6200
  recommended_vram_mb: 6200
capabilities:
  shape:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install -e ./extensions/CUBVH
    vram_required_mb: 6200
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  rigging:
    enabled: true
    native_build_required: true
    native_steps:
    - pip install -e ./extensions/CUBVH
    vram_required_mb: 6200
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
