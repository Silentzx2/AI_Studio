name: anigen
label: AniGen
source:
  repo: https://github.com/VAST-AI-Research/AniGen.git
  ref: main
  submodules: false
  local_dir: AniGen
environment:
  python: '3.10'
  torch: 2.5.1
  cuda: '12.4'
dependencies:
  python:
   - pillow>=10.0
   - imageio>=2.31
   - imageio-ffmpeg>=0.5
   - tqdm>=4.60
   - easydict>=1.10
   - opencv-python-headless>=4.8
   - scipy>=1.10
   - ninja
   - rembg>=2.0
   - onnxruntime>=1.17
   - trimesh>=4.0
   - xatlas>=0.0.9
   - pyvista>=0.43
   - pymeshfix>=0.17
   - igraph>=0.11
   - pygltflib>=1.16
   - numpy>=1.24,<2
   - psutil>=5.9
   - safetensors>=0.4
   - scikit-learn>=1.3
   - geffnet>=1.0
   - transformers>=4.40
   - omegaconf>=2.3.0
   - utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8
  imports:
  - torch
  - transformers
  native:
   - pytorch3d
   - nvdiffrast
  # CUDA-only packages: dropped on CPU-only hosts (no CUDA toolkit)
  cuda_native_packages:
  - pytorch3d
  - flash-attn
  - xformers
  # Packages whose build step imports torch (need --no-build-isolation-package)
  torch_build_packages:
  - pytorch3d
  - nvdiffrast
  - flash-attn
  - xformers
  # Pre-install these when rembg is detected (py3.12 compat for pymatting chain)
  rembg_preinstall:
  - pymatting>=1.1.15
  - numba>=0.60
  - llvmlite>=0.43
  extra: []
  wheels:
    pytorch3d:
      available: true
      mode: extra_index
      index: https://miropsota.github.io/torch_packages_builder
      version: "0.7.9+d9839a9"
    nvdiffrast:
      available: true
      mode: direct_url
      direct_url_template: https://huggingface.co/spaces/JeffreyXiang/TRELLIS/resolve/main/wheels/nvdiffrast-0.3.3-cp310-cp310-linux_x86_64.whl?download=true
      version: "0.3.3"
  fallbacks:
    pytorch3d:
    - https://miropsota.github.io/torch_packages_builder
    nvdiffrast:
    - https://huggingface.co/spaces/JeffreyXiang/TRELLIS/resolve/main/wheels/nvdiffrast-0.3.3-cp310-cp310-linux_x86_64.whl?download=true
  optional:
  - flash-attn
  - xformers
  representation_required: []
  local_extensions: {}
  build_deps:
    pytorch3d: ["ninja"]
    nvdiffrast: ["ninja"]
  cuda_native:
   - pytorch3d
   - nvdiffrast
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
    CUDA_HOME: "/usr/local/cuda"
weights:
  primary:
    repo: VAST-AI/AniGen_Weights
  auxiliary: []
  size_estimate_gb: 23
hardware:
  minimum_vram_mb: 18432
  recommended_vram_mb: 18432
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 18432
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
  rigging:
    enabled: true
    native_build_required: true
    vram_required_mb: 18432
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - transformers
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
