name: triposg
label: "TripoSG"
source:
  repo: "https://github.com/VAST-AI-Research/TripoSG.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    # From upstream requirements.txt (only numpy==1.22.3 is pinned)
    - "diffusers"
    - "transformers"
    - "einops"
    - "huggingface_hub"
    - "opencv-python"
    - "trimesh"
    - "omegaconf"
    - "scikit-image"
    - "numpy==1.22.3"
    - "peft"
    - "jaxtyping"
    - "typeguard"
    - "diso"
    - "pymeshlab"
  imports:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  native:
    # CUDA extension — handled by native resolver (wheel-first)
    - "diso"
weights:
  primary:
    repo: "VAST-AI/TripoSG"
  auxiliary: []
hardware:
  minimum_vram_mb: 8192
  recommended_vram_mb: 8192
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 8192
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
