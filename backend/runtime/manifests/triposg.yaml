name: triposg
label: TripoSG
source:
  repo: https://github.com/VAST-AI-Research/TripoSG.git
  ref: main
  submodules: false
  local_dir: TripoSG
environment:
  python: '3.10'
  torch: 2.5.1
  # CUDA version is dynamically detected at install time
  python_pin_rewrites:
  # numpy 1.22.x builds via distutils (gone in 3.12); rewrite to a cp312
  # compatible pin that stays <2.0 to match the backend venv's numpy<2.0.
  - pattern: "^numpy==1\\.22\\..*$"
    replacement: "numpy>=1.26.4,<2.0"
  # flash-attn publishes no cp312 wheels — drop on Py3.12
  - pattern: "^flash[-_]attn($|==|>=|<=|!=|~=).*$"
    replacement: null
dependencies:
  python:
   - Pillow>=10.0
   - imageio
   - imageio-ffmpeg
   - diffusers
   - transformers
   - einops
   - huggingface_hub
   - opencv-python
   - trimesh
   - omegaconf
   - scikit-image
   - numpy==1.22.3
   - peft
   - jaxtyping
   - typeguard
   - pymeshlab
   - tqdm
   - rembg
  imports:
  - torch
  - diffusers
  - transformers
  - accelerate
  native:
  - diso
  # CUDA-only packages: dropped on CPU-only hosts (no CUDA toolkit)
  cuda_native_packages:
  - diso
  # Packages whose build step imports torch (need --no-build-isolation-package)
  torch_build_packages:
  - diso
  extra:
  - diffusers>=0.22.0
  - huggingface_hub>=0.28.0
  - accelerate
  wheels:
    diso:
      available: false
      reason: PyPI wheel requires compilation; source build with CUDA toolkit needed.
  fallbacks: {}
  optional: []
  representation_required:
  - diso
  local_extensions: {}
  build_deps:
    diso: ["ninja", "setuptools<70"]
  cuda_native:
  - diso
  build_env:
    TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0"
weights:
  primary:
    repo: VAST-AI/TripoSG
  auxiliary:
    - name: RMBG-1.4
      repo: briaai/RMBG-1.4
      required: true
      description: "BRIA RMBG-1.4 background removal weights for image preprocessing"
  size_estimate_gb: 8
hardware:
  minimum_vram_mb: 8192
  recommended_vram_mb: 8192
  low_vram_supported: false
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 8192
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
preflight:
  check_model_venv: true
  import_packages:
  - torch
  - diffusers
  - transformers
  - accelerate
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
