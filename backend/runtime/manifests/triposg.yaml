name: triposg
label: "TripoSG"
source:
  repo: "https://github.com/VAST-AI-Research/TripoSG.git"
  ref: "main"
  submodules: false
environment:
  python: "3.10"
  torch: "2.5.1"
  cuda: "12.4"
dependencies:
  python:
    - "diffusers>=0.22.0"
    - "huggingface_hub==0.27.1"
    - "accelerate"
  imports:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  native: []
weights:
  primary:
    repo: "VAST-AI/TripoSG"
  auxiliary:
    - name: RMBG-1.4
      repo: briaai/RMBG-1.4
      required: true
hardware:
  minimum_vram_mb: 8192
  recommended_vram_mb: 8192
capabilities:
  shape:
    enabled: true
    native_build_required: false
    vram_required_mb: 8192
  texture_pbr:
    enabled: false
    native_build_required: false
    vram_required_mb: 0
preflight:
  check_model_venv: true
  import_packages:
    - "torch"
    - "diffusers"
    - "transformers"
    - "accelerate"
  check_weights: true
  check_cuda: true
  load_weights: true
  smoke_inference: true
