# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Default DB URL — used only when neither $DATABASE_URL nor settings.database_url
# are available (env.py prefers both over this value). The previous value
# targeted a Docker Compose 'postgres' service name that does not exist in
# native/Colab deployments, causing socket.gaierror. Default to the local
# instance so a bare `alembic upgrade head` resolves correctly everywhere.
sqlalchemy.url = postgresql+asyncpg://ai_studio:ai_studio_dev@127.0.0.1:5432/ai_studio


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S