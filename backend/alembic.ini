# Alembic config for the AI Studio FastAPI backend.
#
# Run from the repository root:
#   cd backend && alembic upgrade head
# or via the helper: scripts/migrate.sh
#
# script_location is resolved relative to this file so CWD does not matter.
# The connection URL is computed in env.py from DATABASE_URL so the sync
# psycopg2 driver is always used (Alembic is synchronous).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S