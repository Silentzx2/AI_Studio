# AI 3D Studio - Docker Compose
#
# GPU-ONLY MODE: This application requires an NVIDIA GPU.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai3dstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai3dstudio
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AI_PROVIDER: ${AI_PROVIDER:-hunyuan3d-2.1}
      RUNTIME_MODE: ${RUNTIME_MODE:-local}
      STORAGE_LOCAL_PATH: /app/storage
      RUNTIME_CACHE_DIR: /app/.runtime_cache
      HF_HOME: /app/third_party/.hf_cache
      HUGGINGFACE_HUB_CACHE: /app/third_party/.hf_cache/hub
      TRANSFORMERS_CACHE: /app/third_party/.hf_cache/transformers
      TORCH_HOME: /app/third_party/.hf_cache/torch
      WEIGHTS_DIR: /app/third_party/weights
      CUDA_VISIBLE_DEVICES: all
      CUDA_DEVICE: ${CUDA_DEVICE:-auto}
      NVIDIA_VISIBLE_DEVICES: all
      PLATFORM_MODE: gpu
      CPU_FALLBACK: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      BLENDER_EXECUTABLE: ${BLENDER_EXECUTABLE:-/usr/bin/blender}
      BLENDER_ENABLED: ${BLENDER_ENABLED:-true}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000","http://0.0.0.0:3000"]'
      DEBUG: ${DEBUG:-false}
      PYTHONPATH: "/app"
    # ponytail: Section 5 — bind mounts so model data is visible on host disk
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/third_party:/app/third_party
      - ./backend/.runtime_cache:/app/.runtime_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 -Q generation,images
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/ai3dstudio
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AI_PROVIDER: ${AI_PROVIDER:-hunyuan3d-2.1}
      RUNTIME_MODE: ${RUNTIME_MODE:-local}
      STORAGE_LOCAL_PATH: /app/storage
      RUNTIME_CACHE_DIR: /app/.runtime_cache
      HF_HOME: /app/third_party/.hf_cache
      HUGGINGFACE_HUB_CACHE: /app/third_party/.hf_cache/hub
      TRANSFORMERS_CACHE: /app/third_party/.hf_cache/transformers
      TORCH_HOME: /app/third_party/.hf_cache/torch
      WEIGHTS_DIR: /app/third_party/weights
      CUDA_VISIBLE_DEVICES: all
      CUDA_DEVICE: ${CUDA_DEVICE:-auto}
      NVIDIA_VISIBLE_DEVICES: all
      PLATFORM_MODE: gpu
      CPU_FALLBACK: "false"
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      LAZY_MODEL_LOADING: "true"
      AUTO_UNLOAD_AFTER_JOB: "true"
      # FIX: Ensure /app (containing runtime/ package) is always on Python path
      PYTHONPATH: "/app"
    # ponytail: Section 5 — bind mounts so model data is visible on host disk
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/third_party:/app/third_party
      - ./backend/.runtime_cache:/app/.runtime_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, os; r = redis.from_url(os.environ.get('REDIS_URL', 'redis://redis:6379/0')); r.ping()\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
