  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   command: alembic upgrade head
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai3dstudio
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: "no"
  #   healthcheck:
  #     test: ["CMD-SHELL", "exit 0"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 5s
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai3dstudio
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  # ponytail: Section 5 — model_storage and third_party_storage removed;
  # now using bind mounts to ./backend/storage and ./backend/third_party
