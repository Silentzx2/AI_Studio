# CPU-Only Override for Docker Compose
# Use: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# This override explicitly disables GPU support, forcing CPU-only mode.
# Useful when:
#   - You have a GPU but want to test CPU mode
#   - Running in environments without NVIDIA runtime
#   - Testing resource constraints
#
# This is the default behavior - the base docker-compose.yml is already CPU-first.
# Use this file only to explicitly override any GPU settings.
#
services:
  api:
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
      NVIDIA_VISIBLE_DEVICES: ""
      PLATFORM_MODE: cpu
      AI_PROVIDER: mock

  worker:
    profiles: []
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
      NVIDIA_VISIBLE_DEVICES: ""
      PLATFORM_MODE: cpu
      AI_PROVIDER: mock

  migrate:
    profiles: []
    command: python -c "print('Migration skipped - CPU mode')"
